// ── ROOM 4: RIDDLES requiring real Torah knowledge ──
const RIDDLES = [
  {
    q: "I was written in a prison cell in Petersburg. The Alter Rebbe composed me to bring Chassidus to every Jew. My 53 chapters teach that a Jew's neshama is 'literally a part of Hashem above.' Every Chossid studies me daily. What am I?",
    a: ["TANYA","THE TANYA","SEFER HATANYA","SEFER TANYA","LIKUTEI AMARIM","LIKKUTEI AMARIM","LIKUTEY AMARIM","LIKKUTEY AMARIM","TANYAH"],

    a: ["BECHEZKAS MOSHIACH","BECHEZKAS MASHIACH","CHEZKAS MOSHIACH","CHEZKAS MASHIACH","PRESUMED MOSHIACH","PRESUMED MASHIACH","MOSHIACH BECHEZKAS","BCHEZKAS MOSHIACH","BECHEZKAT MASHIACH","BECHEZKAT MOSHIACH","BCHEZKAT MOSHIACH","CHEZKAT MOSHIACH","MOSHIACH","MASHIACH","MOSHIACH VADAI","MASHIACH VADAI","DEFINITE MOSHIACH","MOSHIACH BVADAI","MASHIACH BVADAI"],

// ── ROOM 5: THE GEULAH VAULT ──
// Code = 7707 → 770 (must know the Rebbe's address) + 7 (derive from game)
const VAULT_CODE = "7707";

// ═══ DESIGN SYSTEM ═══
const C = {
  bg:"#04060e", panel:"rgba(8,14,28,0.85)",
  blue:"#00d4ff", blueDim:"rgba(0,212,255,0.3)", blueGlow:"rgba(0,212,255,0.15)",
  gold:"#ffd700", goldDim:"rgba(255,215,0,0.3)",
  white:"#e8eaff", dim:"#4a5580",
  danger:"#ff3355", success:"#00ff88", accent:"#7b5cff",
};

const KF = `
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes glow{0%,100%{box-shadow:0 0 8px ${C.blueDim}}50%{box-shadow:0 0 24px ${C.blue}44}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes gridScroll{0%{background-position:0 0}100%{background-position:0 60px}}
@keyframes borderPulse{0%,100%{border-color:${C.blue}22}50%{border-color:${C.blue}66}}
`;

const mono = "'Courier New', Courier, monospace";
const serif = "Georgia, 'Times New Roman', serif";

const btnPrimary = {
  fontFamily:mono,fontSize:"0.78rem",padding:"0.65rem 1.5rem",
  background:`linear-gradient(135deg, rgba(0,212,255,0.12), rgba(0,212,255,0.04))`,
  border:`1px solid ${C.blue}55`,color:C.blue,cursor:"pointer",
  letterSpacing:"0.18em",borderRadius:0,textTransform:"uppercase",transition:"all 0.3s",
};
const inputStyle = {
  fontFamily:mono,fontSize:"1rem",padding:"0.65rem 1rem",
  background:"rgba(0,212,255,0.04)",border:`1px solid ${C.blue}33`,
  color:C.white,textAlign:"center",letterSpacing:"0.2em",outline:"none",borderRadius:0,
};
const dialBtn = {
  fontFamily:mono,fontSize:"0.9rem",padding:"0.3rem 0.8rem",
  background:"rgba(0,212,255,0.05)",border:`1px solid ${C.blue}33`,
  color:C.blue,cursor:"pointer",width:52,borderRadius:0,
};

// ═══ AMBIENT COMPONENTS ═══
function HexGrid() {
  return <div style={{position:"absolute",inset:0,overflow:"hidden",pointerEvents:"none",opacity:0.035}}>
    <div style={{width:"100%",height:"100%",backgroundImage:`linear-gradient(${C.blue} 1px, transparent 1px),linear-gradient(90deg, ${C.blue} 1px, transparent 1px)`,backgroundSize:"60px 60px",animation:"gridScroll 8s linear infinite"}}/>
  </div>;
}
function Scanline() {
  return <div style={{position:"absolute",inset:0,pointerEvents:"none",overflow:"hidden",opacity:0.025}}>
    <div style={{width:"100%",height:200,background:`linear-gradient(180deg, transparent, ${C.blue}, transparent)`,animation:"scanline 4s linear infinite"}}/>
  </div>;
}
function GlowOrb({ x, y, size, color, delay }) {
  return <div style={{position:"absolute",left:`${x}%`,top:`${y}%`,width:size,height:size,borderRadius:"50%",background:`radial-gradient(circle, ${color}22, transparent 70%)`,animation:`float ${3+Math.random()*3}s ease-in-out ${delay}s infinite`,pointerEvents:"none"}}/>;
}

function TopBar({ roomNum, timer, onHint, hintsUsed }) {
  const fmt = `${String(Math.floor(timer/60)).padStart(2,"0")}:${String(timer%60).padStart(2,"0")}`;
  const urgent = timer < 300;
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0.7rem 1.2rem",borderBottom:`1px solid ${C.blueDim}`,background:"rgba(4,6,14,0.92)",backdropFilter:"blur(12px)",flexWrap:"wrap",gap:"0.5rem",position:"relative",zIndex:10}}>
      <div style={{fontFamily:mono,fontSize:"0.68rem",color:C.blue,letterSpacing:"0.25em"}}><span style={{opacity:0.4}}>{"//>"}</span> CHAMBER {roomNum}/5</div>
      <div style={{fontFamily:mono,fontSize:"1.2rem",letterSpacing:"0.15em",color:urgent?C.danger:C.gold,textShadow:urgent?`0 0 12px ${C.danger}`:`0 0 12px ${C.gold}44`,animation:urgent?"pulse 0.6s infinite":"none"}}>[{fmt}]</div>
      <button onClick={onHint} style={{fontFamily:mono,fontSize:"0.62rem",padding:"0.3rem 0.9rem",background:"transparent",border:`1px solid ${C.blueDim}`,color:C.blue,cursor:"pointer",letterSpacing:"0.15em",borderRadius:0}}>? HINT ({hintsUsed})</button>
    </div>
  );
}
function Inventory({ items }) {
  if (!items.length) return null;
  return <div style={{padding:"0.5rem 1rem",borderTop:`1px solid ${C.blueDim}`,background:"rgba(4,6,14,0.85)",display:"flex",gap:"0.5rem",flexWrap:"wrap",alignItems:"center"}}>
    <span style={{fontFamily:mono,fontSize:"0.58rem",color:C.dim,letterSpacing:"0.2em"}}>ACQUIRED:</span>
    {items.map((item,i) => <span key={i} style={{fontFamily:mono,fontSize:"0.62rem",color:C.blue,background:C.blueGlow,padding:"0.2rem 0.6rem",border:`1px solid ${C.blueDim}`}}>{item}</span>)}
  </div>;
}
function NarrativeOverlay({ text }) {
  return <div style={{position:"fixed",inset:0,background:"rgba(2,4,10,0.92)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:"2rem",backdropFilter:"blur(8px)"}}>
    <div style={{maxWidth:500,textAlign:"center",animation:"fadeUp 0.6s ease-out"}}>
      <div style={{width:40,height:1,background:C.blue,margin:"0 auto 1.2rem",opacity:0.5}}/>
      <p style={{fontFamily:serif,fontSize:"1.15rem",color:C.white,lineHeight:1.8,fontStyle:"italic"}}>{text}</p>
      <div style={{width:40,height:1,background:C.blue,margin:"1.2rem auto 0",opacity:0.5}}/>
    </div>
  </div>;
}

// ═══ MAIN COMPONENT ═══
function GeulahProtocol() {
  const [screen, setScreen] = useState("intro");
  const [timer, setTimer] = useState(45*60);
  const [running, setRunning] = useState(false);
  const [hintsUsed, setHintsUsed] = useState(0);
  const [hintText, setHintText] = useState("");
  const [shaking, setShaking] = useState(false);
  const [flashColor, setFlashColor] = useState(null);
  const [inventory, setInventory] = useState([]);
  const [narrative, setNarrative] = useState("");

  const [gemInput, setGemInput] = useState("");
  const [selected, setSelected] = useState([]);
  const [sefOrder, setSefOrder] = useState([]);
  const [currentRiddle, setCurrentRiddle] = useState(0);
  const [riddleInput, setRiddleInput] = useState("");
  const [riddlesSolved, setRiddlesSolved] = useState(0);
  const [vaultDigits, setVaultDigits] = useState([0,0,0,0]);
  const [wrongMsg, setWrongMsg] = useState("");

  // Player & results
  const [playerName, setPlayerName] = useState("");
  const [completionCode, setCompletionCode] = useState("");

  const timerRef = useRef(null);

  // Generate a verification code from result data
  const generateCode = (name, score, elapsed, hints) => {
    const raw = `${name}|${score}|${elapsed}|${hints}|GEULAH`;
    let hash = 0;
    for (let i = 0; i < raw.length; i++) {
      hash = ((hash << 5) - hash + raw.charCodeAt(i)) | 0;
    }
    const hex = Math.abs(hash).toString(16).toUpperCase().padStart(6, "0");
    return `G-${hex.slice(0,3)}-${hex.slice(3,6)}`;
  };

  // ─── EMAIL NOTIFICATION ───
  // To set your email: replace the string inside atob("...") with your
  // own base64-encoded email. To encode, open browser console and type:
  //   btoa("your@email.com")
  // Then paste the result between the quotes below.
  // Example: btoa("test@example.com") → "dGVzdEBleGFtcGxlLmNvbQ=="
  //
  // IMPORTANT: After first submission, Formsubmit.co will send you a
  // confirmation email — click the link in it to activate.
  const OWNER_EMAIL_B64 = "dHJlZW9mbGlmZWJvb2tpbmZvQGdtYWlsLmNvbQ=="; // encoded

  const sendEmailNotification = async (entry) => {
    try {
      const email = atob(OWNER_EMAIL_B64);
      if (!email || !email.includes("@")) return;
      await fetch(`https://formsubmit.co/ajax/${email}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          _subject: `Geulah Protocol Completed by ${entry.name}!`,
          Name: entry.name,
          Score: entry.score,
          Time: entry.time,
          Hints_Used: entry.hints,
          Verification_Code: entry.code,
          Date: new Date().toLocaleString(),
          _template: "table",
        }),
      });
    } catch (e) {
      // Silent fail — don't disrupt the game
    }
  };


  useEffect(() => {
    if (running && timer > 0) {
      timerRef.current = setInterval(() => setTimer(t => {
        if (t <= 1) { clearInterval(timerRef.current); setScreen("gameover"); setRunning(false); return 0; }
        return t - 1;
      }), 1000);
      return () => clearInterval(timerRef.current);
    }
  }, [running]);

  const fmt = (s) => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  const doShake = () => { setShaking(true); setTimeout(() => setShaking(false), 500); };
  const doFlash = (c) => { setFlashColor(c); setTimeout(() => setFlashColor(null), 400); };
  const showStory = (text, cb) => { setNarrative(text); setTimeout(() => { setNarrative(""); if(cb) cb(); }, 3800); };
  const showWrong = (msg) => { setWrongMsg(msg); setTimeout(() => setWrongMsg(""), 4000); };

  const useHint = () => {
    const hints = {
      room1: "The nachash introduced sin into the world. What is the ultimate tikkun for that sin? The Zohar says the cure is hidden in the disease itself — same gematria. Think: who comes to fix what the serpent broke?",
      room2: "There are exactly 10 Mivtzoim — not 11, not 9. Some items here are important mitzvos that every Jew should do, but the Rebbe never designated them as one of his specific campaigns.",
      room3: "Think of the Ushpizin — seven guests of the Sukkah. The Avos come first, in order. Then think: who carried Israel through the desert? Who made peace between brothers? Who resisted temptation? Who united the kingdom?",
      room4: RIDDLES[currentRiddle]?.hint || "Think...",
      room5: "Three digits: where the Rebbe davened, farbrenged, and led world Jewry — its address on Eastern Parkway. The 4th digit: how many lower Sefiros are there?",
    };
    setHintsUsed(h => h + 1);
    setHintText(hints[screen] || "");
    setTimeout(() => setHintText(""), 8000);
  };

  const startGame = () => {
    if (!playerName.trim()) { doShake(); showWrong("Enter your name before starting!"); return; }
    setRunning(true);
    showStory("The Rebbe taught: the world stands ready for Geulah. Every mitzvah tips the cosmic scale. Your mission — unlock the five seals of the Geulah Protocol...", () => setScreen("room1"));
  };

  // Shuffled items for Room 2
  const shuffledItems = useMemo(() => [...ALL_ITEMS].sort((a,b) => {
    const hashA = a.id.split("").reduce((s,c) => s + c.charCodeAt(0), 0);
    const hashB = b.id.split("").reduce((s,c) => s + c.charCodeAt(0), 0);
    return hashA - hashB;
  }), []);

  const scrambledSefiros = useMemo(() => {
    const order = [6, 3, 0, 5, 2, 4, 1];
    return order.map(i => SEFIROS_DATA[i]);
  }, []);

  // ═══ ROOM SHELL ═══
  const shell = (num, title, subtitle, hebTitle, children) => (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:C.bg,color:C.white,fontFamily:serif,animation:shaking?"shake 0.4s ease-in-out":"none",position:"relative",overflow:"hidden"}}>
      <style>{KF}</style>
      <HexGrid/><Scanline/>
      {flashColor && <div style={{position:"fixed",inset:0,background:flashColor,opacity:0.1,zIndex:100,pointerEvents:"none"}}/>}
      {narrative && <NarrativeOverlay text={narrative}/>}
      <TopBar roomNum={num} timer={timer} onHint={useHint} hintsUsed={hintsUsed}/>
      {hintText && <div style={{background:C.blueGlow,border:`1px solid ${C.blueDim}`,margin:"0.5rem 1rem",padding:"0.8rem 1rem",fontFamily:mono,fontSize:"0.8rem",color:C.blue,animation:"fadeUp 0.3s ease-out",position:"relative",zIndex:5}}><span style={{opacity:0.5}}>{"[!] "}</span>{hintText}</div>}
      {wrongMsg && <div style={{background:"rgba(255,51,85,0.08)",border:`1px solid ${C.danger}44`,margin:"0.5rem 1rem",padding:"0.8rem 1rem",fontFamily:mono,fontSize:"0.78rem",color:C.danger,animation:"fadeUp 0.3s ease-out",position:"relative",zIndex:5}}>{wrongMsg}</div>}
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"1.5rem 1rem",position:"relative",zIndex:2,overflow:"auto"}}>
        {hebTitle && <div style={{fontFamily:serif,fontSize:"1.6rem",color:C.gold,marginBottom:"0.15rem",textShadow:`0 0 20px ${C.goldDim}`}}>{hebTitle}</div>}
        <h2 style={{fontFamily:mono,fontSize:"clamp(0.85rem,3vw,1.15rem)",color:C.blue,textAlign:"center",marginBottom:"0.1rem",letterSpacing:"0.2em",textTransform:"uppercase"}}>{title}</h2>
        <p style={{fontFamily:mono,fontSize:"0.6rem",color:C.dim,letterSpacing:"0.25em",textAlign:"center",marginBottom:"1.5rem",textTransform:"uppercase"}}>{subtitle}</p>
        {children}
      </div>
      <Inventory items={inventory}/>
    </div>
  );

  // ═══════════════════════════
  //  INTRO
  // ═══════════════════════════
  if (screen === "intro") return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:"2rem",textAlign:"center",position:"relative",overflow:"hidden",background:`radial-gradient(ellipse at 50% 30%, #0a1025, ${C.bg} 70%)`}}>
      <style>{KF}</style>
      <HexGrid/><Scanline/>
      <GlowOrb x={20} y={30} size={200} color={C.blue} delay={0}/>
      <GlowOrb x={75} y={60} size={160} color={C.gold} delay={1.5}/>
      <GlowOrb x={50} y={80} size={120} color={C.accent} delay={0.8}/>

  // ═══════════════════════════

  // ═══════════════════════════

    return (
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",minHeight:"100vh",padding:"2rem",textAlign:"center",position:"relative",overflow:"hidden",background:`radial-gradient(ellipse at 50% 40%, #0a1025, ${C.bg} 70%)`,fontFamily:serif,color:C.white}}>

        <div style={{position:"relative",zIndex:2,maxWidth:480,width:"100%",paddingTop:"1.5rem"}}>
          <div style={{fontSize:"1.8rem",color:C.gold,marginBottom:"0.4rem",textShadow:`0 0 30px ${C.goldDim}`}}>!משיח נאו</div>
          <h1 style={{fontFamily:mono,fontSize:"clamp(1.4rem,5vw,2.1rem)",color:C.blue,letterSpacing:"0.2em",fontWeight:400,marginBottom:"0.2rem"}}>MOSHIACH NOW</h1>
          <div style={{fontFamily:mono,fontSize:"0.62rem",color:C.dim,letterSpacing:"0.3em",marginBottom:"1rem"}}>GEULAH PROTOCOL COMPLETE</div>

          {/* ─── RESULT CARD — designed for screenshot ─── */}
          <div style={{
            background:"linear-gradient(135deg, rgba(8,14,28,0.95), rgba(4,6,14,0.98))",
            border:`2px solid ${C.gold}44`,padding:"1.4rem 1.2rem",marginBottom:"1rem",
            boxShadow:`0 0 30px rgba(0,0,0,0.4), inset 0 0 30px rgba(255,215,0,0.03)`,
            position:"relative",
          }}>
            {/* Corner accents */}
            {[[0,0],[1,0],[0,1],[1,1]].map(([x,y],i) => (
              <div key={i} style={{position:"absolute",[y?"bottom":"top"]:6,[x?"right":"left"]:6,width:10,height:10,borderTop:y?"none":`1px solid ${C.gold}55`,borderBottom:y?`1px solid ${C.gold}55`:"none",borderLeft:x?"none":`1px solid ${C.gold}55`,borderRight:x?`1px solid ${C.gold}55`:"none"}}/>
            ))}

            <div style={{fontFamily:mono,fontSize:"0.5rem",color:C.dim,letterSpacing:"0.3em",marginBottom:"0.6rem"}}>GEULAH PROTOCOL — COMPLETION CERTIFICATE</div>
            <div style={{fontFamily:mono,fontSize:"1rem",color:C.gold,marginBottom:"0.8rem"}}>{name}</div>

            <div style={{display:"flex",gap:"1rem",justifyContent:"center",flexWrap:"wrap",marginBottom:"0.8rem"}}>
              {[{l:"TIME",v:fmt(elapsed)},{l:"HINTS",v:String(hintsUsed)},{l:"SCORE",v:score.toLocaleString()}].map(s => (
                <div key={s.l} style={{minWidth:65}}>
                  <div style={{fontFamily:mono,fontSize:"0.45rem",color:C.dim,letterSpacing:"0.2em",marginBottom:"0.15rem"}}>{s.l}</div>
                  <div style={{fontFamily:mono,fontSize:"1.2rem",color:C.gold}}>{s.v}</div>
                </div>
              ))}
            </div>

            <div style={{width:"100%",height:1,background:`linear-gradient(90deg, transparent, ${C.gold}33, transparent)`,margin:"0.6rem 0"}}/>

            {/* Verification Code — the key piece */}
            <div style={{fontFamily:mono,fontSize:"0.48rem",color:C.dim,letterSpacing:"0.25em",marginBottom:"0.3rem"}}>VERIFICATION CODE</div>
            <div style={{
              fontFamily:mono,fontSize:"1.6rem",color:C.blue,letterSpacing:"0.3em",
              textShadow:`0 0 15px ${C.blueDim}`,
              padding:"0.4rem 0",
              animation:"glow 3s ease-in-out infinite",
            }}>{code}</div>
            <div style={{fontFamily:mono,fontSize:"0.42rem",color:C.dim,letterSpacing:"0.15em",marginTop:"0.3rem"}}>
              SCREENSHOT THIS CARD AND SEND TO VERIFY YOUR COMPLETION
            </div>
          </div>

          <p style={{fontFamily:serif,fontStyle:"italic",color:C.dim,maxWidth:400,lineHeight:1.7,margin:"0 auto 1rem",fontSize:"0.88rem"}}>
            {score >= 8000 ? "The Rebbe would be proud — you brought the Geulah with extraordinary speed and deep Torah knowledge." :
             score >= 5000 ? "Well done! Every mitzvah counts. The Geulah shines through your effort." :
             "Through persistence and emunah — the Geulah came. Ad Mosai — we want Moshiach now!"}
          </p>

          <div style={{display:"flex",gap:"0.4rem",flexWrap:"wrap",justifyContent:"center",margin:"0.5rem 0 1rem"}}>
            {inventory.map((item,i) => <span key={i} style={{fontFamily:mono,fontSize:"0.55rem",color:C.blue,background:C.blueGlow,padding:"0.2rem 0.5rem",border:`1px solid ${C.blueDim}`}}>{item}</span>)}
          </div>

          <div style={{fontFamily:mono,fontSize:"0.5rem",color:C.success,marginBottom:"0.5rem",letterSpacing:"0.15em"}}>✓ RESULT SUBMITTED</div>
          <button onClick={() => window.location.reload()} style={{...btnPrimary,padding:"0.8rem 2rem"}}>PLAY AGAIN</button>
        </div>
      </div>
    );
  }

  // ═══ GAME OVER ═══
  if (screen === "gameover") return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:"2rem",textAlign:"center",background:`radial-gradient(ellipse at 50% 40%, #150505, ${C.bg} 70%)`,fontFamily:serif,color:C.white}}>
      <style>{KF}</style>
      <div style={{fontSize:"2rem",color:C.gold,marginBottom:"0.5rem"}}>⏳</div>
      <h1 style={{fontFamily:mono,fontSize:"clamp(1.3rem,4vw,2rem)",color:C.danger,letterSpacing:"0.15em",fontWeight:400}}>TIME EXPIRED</h1>
      <p style={{fontStyle:"italic",color:C.dim,fontSize:"1rem",margin:"1rem 0",lineHeight:1.7,maxWidth:400}}>
        The Geulah requires persistence and learning. As the Rebbe said — "We want Moshiach now!" Go back, learn more, and try again with renewed strength.
      </p>
      <button onClick={() => window.location.reload()} style={{...btnPrimary,marginTop:"0.5rem"}}>TRY AGAIN</button>
    </div>
  );

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(GeulahProtocol));
</script>

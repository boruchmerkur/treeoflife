<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Geula Quest — The Tree of Life</title>
<meta name="description" content="Geula Quest — a story-driven Geulah adventure from The Tree of Life.">
<meta name="theme-color" content="#243a2c">
<link rel="icon" href="/assets/favicon.png">
<style>
  :root{ --cream:#f7f0e2; --evergreen:#243a2c; --gold:#b88a2f; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--evergreen);overflow:hidden}
  #game{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--evergreen)}

  /* On-brand loading veil, fades out when the game is ready */
  #veil{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:22px;background:var(--cream);z-index:5;transition:opacity .6s ease;color:var(--evergreen);
        font-family:Georgia,'Times New Roman',serif;text-align:center;padding:24px}
  #veil.hide{opacity:0;pointer-events:none}
  #veil .mark{width:54px;height:54px;border-radius:50%;border:2px solid rgba(36,58,44,.18);border-top-color:var(--gold);
        animation:spin 1s linear infinite}
  #veil h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.01em}
  #veil p{font-size:.95rem;color:rgba(36,58,44,.6);font-family:system-ui,sans-serif;letter-spacing:.04em}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){#veil .mark{animation:none}}

  /* Quiet "back to the site" tab, top-left, out of the way */
  #home{position:fixed;top:14px;left:14px;z-index:10;display:inline-flex;align-items:center;gap:8px;
        padding:9px 14px 9px 12px;border-radius:999px;background:rgba(247,240,226,.92);backdrop-filter:blur(6px);
        color:var(--evergreen);text-decoration:none;font-family:system-ui,sans-serif;font-size:.74rem;font-weight:600;
        letter-spacing:.12em;text-transform:uppercase;box-shadow:0 2px 12px rgba(0,0,0,.18);opacity:0;
        transition:opacity .4s ease .3s,background .2s}
  #home.show{opacity:1}
  #home:hover{background:#fffdf8}
  #home svg{width:15px;height:15px}
  @media(max-width:560px){#home span{display:none}#home{padding:10px}}
</style>
</head>
<body>
  <a id="home" href="/games" aria-label="Back to Games">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span>All Games</span>
  </a>

  <div id="veil">
    <div class="mark"></div>
    <h1>Geula Quest</h1>
    <p>Loading the escape…</p>
  </div>

  <iframe id="game"
          src="https://geulaquest.netlify.app/"
          title="Geula Quest"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture; web-share; xr-spatial-tracking"
          allowfullscreen></iframe>

  <script>
    (function(){
      var frame = document.getElementById('game');
      var veil  = document.getElementById('veil');
      var home  = document.getElementById('home');
      function reveal(){ veil.classList.add('hide'); home.classList.add('show'); }
      frame.addEventListener('load', reveal);
      // Safety net in case 'load' is missed (cached/cross-origin quirks)
      setTimeout(reveal, 4000);
    })();
  </script>
<!-- network-block -->
<style>.toln{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;padding:8px 16px;font:400 11px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;border-top:1px solid rgba(128,128,128,.1);color:rgba(128,128,128,.45)}.toln a{color:inherit;text-decoration:none}.toln a:hover{color:rgba(128,128,128,.85);text-decoration:underline}.toln .d{color:rgba(128,128,128,.2)}@media(prefers-color-scheme:dark){.toln{border-top-color:rgba(200,200,200,.07);color:rgba(200,200,200,.35)}.toln a:hover{color:rgba(200,200,200,.8)}.toln .d{color:rgba(200,200,200,.15)}}</style>
<nav class="toln" aria-label="Related sites"><a href="https://rabbiboruch.com">Rabbi Boruch</a><span class="d">&#183;</span><a href="https://rebbesletters.com">The Rebbe's Letters</a><span class="d">&#183;</span><a href="https://beismoshiach.org">Beis Moshiach</a></nav>
<script src="https://thetreeoflifebooks.com/network.js" data-site="treeoflife" defer></script>
<!-- /network-block -->
</body>
</html>
